const TOTAL_NUMEROS = 9999;
const PRECO_UNIDADE = 2.0;
const MIN_QTD = 5;
const TEMPO_PIX_SEGUNDOS = 10 * 60;

const fmtBRL = (v) =>
  v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

const fmtTimer = (s) => {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
};

const removerAcentos = (str) =>
  str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");

const tlv = (id, value) => `${id}${String(value.length).padStart(2, "0")}${value}`;

function crc16(payload) {
  let crc = 0xffff;
  const polynomial = 0x1021;
  for (let i = 0; i < payload.length; i++) {
    crc ^= payload.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) {
      crc = (crc & 0x8000) !== 0 ? ((crc << 1) ^ polynomial) & 0xffff : (crc << 1) & 0xffff;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4, "0");
}

function montarPixCopiaCola({ chave, nome, cidade, valor, txid }) {
  const nomeSanitizado = removerAcentos(nome).toUpperCase().slice(0, 25);
  const cidadeSanitizada = removerAcentos(cidade).toUpperCase().slice(0, 15);
  const txidSanitizado = (txid || "***").replace(/[^a-zA-Z0-9]/g, "").slice(0, 25) || "***";
  const valorStr = valor.toFixed(2);

  const merchantAccountInfo = tlv("00", "br.gov.bcb.pix") + tlv("01", chave);
  const additionalData = tlv("05", txidSanitizado);

  let payload =
    tlv("00", "01") +
    tlv("01", "12") +
    tlv("26", merchantAccountInfo) +
    tlv("52", "0000") +
    tlv("53", "986") +
    tlv("54", valorStr) +
    tlv("58", "BR") +
    tlv("59", nomeSanitizado) +
    tlv("60", cidadeSanitizada) +
    tlv("62", additionalData);

  payload += "6304";
  return payload + crc16(payload);
}

}

function SorteioCestaBalet() {

  const [vendidos, setVendidos] = useState(0);
  const [statsLoaded, setStatsLoaded] = useState(false);

  const [qtd, setQtd] = useState(MIN_QTD);
  const [modalOpen, setModalOpen] = useState(false);
  const [step, setStep] = useState("dados"); // dados | pix | aguardando | esgotado | erro
  const [nome, setNome] = useState("");
  const [whats, setWhats] = useState("");
  const [timer, setTimer] = useState(TEMPO_PIX_SEGUNDOS);
  const [orderId, setOrderId] = useState("");
  const [pixCode, setPixCode] = useState("");
  const [copiado, setCopiado] = useState(false);
  const intervalRef = useRef(null);
  const qrRef = useRef(null);

  const [consultaWhats, setConsultaWhats] = useState("");
  const [consultaResultado, setConsultaResultado] = useState(null);
  const [showConsulta, setShowConsulta] = useState(false);
  const [verMais, setVerMais] = useState(false);

  const [adminSenha, setAdminSenha] = useState("");
  const [adminLoggedIn, setAdminLoggedIn] = useState(false);
  const [adminPedidos, setAdminPedidos] = useState([]);

  const [envioWhats, setEnvioWhats] = useState(null); // { url, nome } — link pronto pra mandar no WhatsApp
  const [legalOpen, setLegalOpen] = useState(null); // 'termos' | 'privacidade' | null

  const configPendente = GAS_URL.includes("COLE_AQUI");

  const buscarStats = async () => {
    try {
      const resp = await fetch(`${GAS_URL}?action=stats`);
      const data = await resp.json();
      if (data.ok) setVendidos(data.vendidos);
    } catch (err) {
      // segue com 0 se ainda não estiver configurado
    }
    setStatsLoaded(true);
  };

  useEffect(() => {
    buscarStats();
  }, []);

  useEffect(() => {
    if (step === "pix" && pixCode && qrRef.current && window.QRCode) {
      qrRef.current.innerHTML = "";
      new window.QRCode(qrRef.current, {
        text: pixCode,
        width: 180,
        height: 180,
        correctLevel: window.QRCode.CorrectLevel.M,
      });
    }
  }, [step, pixCode]);

  useEffect(() => () => clearInterval(intervalRef.current), []);

  const disponiveis = TOTAL_NUMEROS - vendidos;
  const total = qtd * PRECO_UNIDADE;
  const pctVendido = Math.min(100, (vendidos / TOTAL_NUMEROS) * 100);

  const abrirModal = () => {
    setStep("dados");
    setNome("");
    setWhats("");
    setCopiado(false);
    setModalOpen(true);
  };

  const fecharModal = () => {
    clearInterval(intervalRef.current);
    setModalOpen(false);
  };

  const iniciarPix = async (e) => {
    e.preventDefault();
    if (!nome.trim() || whats.trim().length < 8) return;
    if (disponiveis < qtd) {
      setStep("esgotado");
      return;
    }
    const novoOrderId = "PED" + Date.now();
    try {
      const resp = await fetch(
        `${GAS_URL}?action=create&nome=${encodeURIComponent(nome)}&whats=${encodeURIComponent(
          whats
        )}&qtd=${qtd}&orderId=${novoOrderId}`
      );
      const data = await resp.json();
      if (!data.ok) {
        setStep("erro");
        return;
      }
    } catch (err) {
      setStep("erro");
      return;
    }

    setOrderId(novoOrderId);
    setPixCode(
      montarPixCopiaCola({
        chave: PIX_CHAVE,
        nome: PIX_NOME,
        cidade: PIX_CIDADE,
        valor: total,
        txid: novoOrderId,
      })
    );
    setTimer(TEMPO_PIX_SEGUNDOS);
    setStep("pix");
    clearInterval(intervalRef.current);
    intervalRef.current = setInterval(() => {
      setTimer((t) => {
        if (t <= 1) {
          clearInterval(intervalRef.current);
          setStep("dados");
          return TEMPO_PIX_SEGUNDOS;
        }
        return t - 1;
      });
    }, 1000);
  };

  const copiarCodigo = async () => {
    try {
      await navigator.clipboard.writeText(pixCode);
      setCopiado(true);
      setTimeout(() => setCopiado(false), 2500);
    } catch (err) {
      // navegador sem permissão de clipboard — o código já está visível para copiar manualmente
    }
  };

  const consultar = async (e) => {
    e.preventDefault();
    try {
      const resp = await fetch(`${GAS_URL}?action=lookup&whats=${encodeURIComponent(consultaWhats)}`);
      const data = await resp.json();
      setConsultaResultado(data.ok ? data : "nao-encontrado");
    } catch (err) {
      setConsultaResultado("nao-encontrado");
    }
  };

  const adminEntrar = async (e) => {
    e.preventDefault();
    setAdminMsg("");
    try {
      const resp = await fetch(`${GAS_URL}?action=list&senha=${encodeURIComponent(adminSenha)}`);
      const data = await resp.json();
      if (data.ok) {
        setAdminPedidos(data.pedidos);
        setAdminLoggedIn(true);
      } else {
        setAdminMsg(data.error || "Senha incorreta");
      }
    } catch (err) {

    }
  };

            url: `https://wa.me/${numeroWhats}?text=${encodeURIComponent(mensagem)}`,
            nome: pedido.nome,
          });
        }
      } else {
        setAdminMsg(data.error || "Erro ao confirmar");
      }
    } catch (err) {
      setAdminMsg("Erro de conexão");
    }
  };

        .sb-field input { width: 100%; }
        .sb-resumo {
          background: var(--blush-soft);
          border-radius: 12px;
          padding: 12px 14px;
          font-size: 13.5px;
          display: flex;
          justify-content: space-between;
          margin-bottom: 18px;
        }
        .sb-submit {
          width: 100%;
          background: var(--wine);
          color: #fff;
          border: none;
          border-radius: 12px;
          padding: 14px;
          font-weight: 700;
          font-size: 15px;
          cursor: pointer;
        }
        .sb-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        .sb-pix-timer {
          text-align: center;
          font-family: 'Cormorant Garamond', serif;
          font-size: 40px;
          font-weight: 600;
          color: var(--wine);
          font-variant-numeric: tabular-nums;
          margin: 6px 0 2px;
        }
        .sb-pix-sub { text-align: center; font-size: 13px; color: #8a7570; margin-bottom: 18px; }
        .sb-qr {
          width: 170px;
          height: 170px;
          margin: 0 auto 16px;
          border-radius: 14px;
          background:
            repeating-linear-gradient(45deg, #3d0f1f 0 6px, #fff 6px 12px);
          border: 3px solid var(--wine);
          position: relative;
        }
        .sb-qr::after {
          content: "QR simulado";
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: rgba(255,255,255,0.88);
          color: var(--wine);
          font-weight: 600;
          font-size: 12.5px;
          text-align: center;
        }
        .sb-pix-code {
          background: #f4ece6;
          border-radius: 10px;
          padding: 10px 12px;
          font-size: 11.5px;
          color: #6b5257;
          word-break: break-all;
          margin-bottom: 18px;
          font-family: monospace;
        }
        .sb-demo-note {
          font-size: 12px;
          color: #a08b3f;
          background: #fbf3dc;
          border: 1px solid #ecd99a;
          border-radius: 10px;
          padding: 10px 12px;
          margin-bottom: 16px;
          line-height: 1.5;
        }

        .sb-success { text-align: center; padding: 6px 0 4px; }
        .sb-success-badge {
          width: 62px;
          height: 62px;
          border-radius: 50%;
          background: #e7f5ec;
          color: #1f6b43;
          font-size: 30px;
          display: flex;
          align-items: center;
          justify-content: center;
          margin: 0 auto 14px;
        }
        .sb-success h3 {
          font-family: 'Cormorant Garamond', serif;
          font-size: 22px;
          color: var(--wine);
          margin: 0 0 6px;
        }
        .sb-success p { font-size: 13.5px; color: #6b5257; margin: 0 0 16px; }
        .sb-success .sb-result-numbers { justify-content: center; }
        .sb-success .sb-btn-small { margin-top: 20px; width: 100%; }

        .sb-esgotado { text-align: center; padding: 10px 0; }
        .sb-esgotado p { font-size: 14px; color: #6b5257; margin: 10px 0 18px; }

        .sb-qr-real { display:flex; justify-content:center; margin: 4px 0 16px; }
        .sb-copy-btn {
          width:100%;
          background:#f4ece6;
          color:var(--wine);
          border:1.5px solid var(--wine);
          border-radius:10px;
          padding:12px;
          font-weight:600;
          font-size:13.5px;
          cursor:pointer;
          margin-bottom:10px;
          font-family: inherit;
        }
        .sb-admin-footer { text-align:center; padding: 24px 0 44px; }
        .sb-legal-links {
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 8px;
          margin-bottom: 10px;
        }
        .sb-legal-sep { color: #d9c8be; font-size: 12px; }
        .sb-admin-link-painel { opacity: 0.7; }
        .sb-modal-legal { max-width: 520px; }
        .sb-legal-texto {
          font-size: 13.5px;
          line-height: 1.65;
          color: #423035;
          max-height: 60vh;
          overflow-y: auto;
          padding-right: 4px;
        }
        .sb-legal-texto p { margin: 0 0 12px; }
        .sb-legal-texto strong { color: var(--wine); }
        .sb-admin-link {
          background:none;
          border:none;
          color:#a08b3f;
          font-size:12.5px;
          text-decoration:underline;
          cursor:pointer;
          font-family: inherit;
        }
        .sb-admin-row {
          display:flex;
          justify-content:space-between;
          align-items:center;
          gap:10px;
          padding:12px 0;
          border-bottom:1px solid #eee0d8;
          font-size:13.5px;
        }
        .sb-config-warning {
          background:#fdecec;
          color:#9a2f2f;
          border-bottom:1px solid #f3b9b9;
          padding:10px 14px;
          font-size:12.5px;
          text-align:center;
        }

        .sb-intro {
          position: fixed;
          inset: 0;
          z-index: 100;
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          background: var(--wine-deep);
        }
        .sb-intro-cortina {
          position: absolute;
          top: 0;
          bottom: 0;
          width: 52%;
          background: radial-gradient(ellipse at center, #521a30 0%, var(--wine) 55%, var(--wine-deep) 100%);
          transition: transform 0.9s cubic-bezier(.65,0,.35,1);
        }
        .sb-intro-esquerda { left: 0; border-right: 3px solid var(--gold); }
        .sb-intro-direita { right: 0; border-left: 3px solid var(--gold); }
        .sb-intro-abrindo .sb-intro-esquerda { transform: translateX(-100%); }
        .sb-intro-abrindo .sb-intro-direita { transform: translateX(100%); }
        .sb-intro-conteudo {
          position: relative;
          z-index: 2;
          text-align: center;
          color: var(--cream);
          padding: 0 28px;
          transition: opacity 0.5s ease;
        }
        .sb-intro-abrindo .sb-intro-conteudo { opacity: 0; }
        .sb-intro-eyebrow {
          font-size: 13px;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--gold-bright);
          margin-bottom: 12px;
        }
        .sb-intro-title {
          font-family: 'Cormorant Garamond', serif;
          font-weight: 600;
          font-size: clamp(32px, 9vw, 54px);
          line-height: 1.05;
          margin: 0 0 16px;
        }
        .sb-intro-title em { font-style: italic; color: var(--blush); }
        .sb-intro-sub {
          font-size: 14.5px;
          color: #e9dcd9;
          max-width: 320px;
          margin: 0 auto 28px;
          line-height: 1.5;
        }
        .sb-intro-btn {
          background: var(--gold);
          color: var(--wine-deep);
          border: none;
          border-radius: 100px;
          padding: 15px 32px;
          font-family: 'Work Sans', sans-serif;
          font-weight: 700;
          font-size: 15px;
          cursor: pointer;
          animation: sb-pulse 1.8s ease-in-out infinite;
        }
        @keyframes sb-pulse {
          0%, 100% { transform: scale(1); }
          50% { transform: scale(1.05); }
        }
      `}</style>

            chocolates, perfeita para adoçar o dia de quem ganhar.
          </p>
        </div>
        <ul className="sb-list">
          <li>Biscoitos e torradas Bauducco (integral, cream cracker, maisena e recheados)</li>
          <li>Café, cappuccino e chá em sachês</li>
          <li>Mel, geleia, margarina e creme de avelã em sachês</li>
          <li>Barras de cereal e chocolate Bauducco</li>
          <li>Chocolates Lacta, Garoto, Nestlé, Twix, Trento e Serenata de Amor</li>
          <li>Guloseimas Fini, wafer e biscoito Club Social</li>
        </ul>

        <button className="sb-vermais-btn" onClick={() => setVerMais((v) => !v)}>
          {verMais ? "Ver menos" : "Ver todos os 52 itens"}

        {verMais && (
          <div className="sb-vermais-lista">
            <div>
              <h3>Café da manhã</h3>
              <ul>
                <li>1 Cereal matinal</li>
                <li>1 Torrada Bauducco integral</li>
                <li>1 Torrada Bauducco</li>
                <li>2 Biscoito Bauducco cream cracker 9g</li>
                <li>2 Biscoito Bauducco maisena 9g</li>

                <li>3 Açúcar sachê 5g</li>
                <li>2 Adoçante sachê 600mg</li>
                <li>1 Barra Bauducco goiabinha 30g</li>
                <li>1 Barra Bauducco chocolate 25g</li>
                <li>1 Biscoito Club Social 24g</li>
                <li>1 Chá sachê 1,68g</li>
                <li>1 Wafer/bolinho</li>
              </ul>
            </div>
            <div>
              <h3>Chocolates</h3>
              <ul>
                <li>2 Twix 15g</li>
                <li>2 Serenata de Amor/bombom Amor/bon-bon 16,5g</li>
                <li>1 Fini sabores 15g</li>
                <li>1 Fini tube 15g</li>
                <li>1 Mini disquete 11g</li>
                <li>5 Bombons sortidos Lacta</li>
                <li>3 Bombons sortidos Garoto</li>
                <li>3 Mini Trento 16g</li>
                <li>3 Bombons sortidos Nestlé</li>
                <li>2 Creme de avelã 9,6g</li>
              </ul>
            </div>
          </div>
        )}

        <p className="sb-obs">

          </div>

        <p className="sb-aumente-chances">Aumente suas chances:</p>

        <div className="sb-quick-btns">
          <button className="sb-quick-btn" onClick={() => setQtd((q) => q + 5)}>+5 números</button>
          <button className="sb-quick-btn" onClick={() => setQtd((q) => q + 10)}>+10 números</button>
          <button className="sb-quick-btn" onClick={() => setQtd((q) => q + 20)}>+20 números</button>

        {/* ÁREA DO CLIENTE */}
        <div className="sb-client-area">

          {showConsulta && (
            <>
              <form className="sb-client-form" onSubmit={consultar}>
                <input
                  className="sb-input"
                  placeholder="Seu WhatsApp (com DDD)"
                  value={consultaWhats}
                  onChange={(e) => setConsultaWhats(e.target.value)}

                <button className="sb-btn-small" type="submit">Consultar</button>
              </form>
              {consultaResultado === "nao-encontrado" && (
                <div className="sb-result-box">

                </div>

                  {consultaResultado.numeros.length > 0 && (
                    <>
                      {" "}— {consultaResultado.numeros.length} número(s)
                      <div className="sb-result-numbers">
                        {consultaResultado.numeros.map((n) => (
                          <span className="sb-chip" key={n}>{n}</span>
                        ))}
                      </div>
                    </>
                  )}
                  {consultaResultado.pendente && (
                    <div style={{ marginTop: "8px" }}>Você tem um pedido aguardando confirmação de pagamento.</div>

      {/* BARRA FIXA */}
      <div className="sb-sticky">
        <div className="sb-sticky-inner">
          <div className="sb-stepper">
            <button onClick={() => setQtd((q) => Math.max(MIN_QTD, q - 1))} disabled={qtd <= MIN_QTD}>–</button>
            <span className="sb-qtd-val">{qtd}</span>
            <button onClick={() => setQtd((q) => q + 1)}>+</button>
          </div>
          <div className="sb-sticky-price">
            <span className="lbl">{qtd} títulos</span>
            <span className="val">{fmtBRL(total)}</span>
          </div>
          <button className="sb-cta" onClick={abrirModal} disabled={!statsLoaded}>
            QUERO GARANTIR MINHAS CHANCES
          </button>
        </div>
      </div>

      {/* MODAL DE CHECKOUT */}
      {modalOpen && (
        <div className="sb-overlay" onClick={(e) => e.target === e.currentTarget && fecharModal()}>
          <div className="sb-modal">
            <div className="sb-modal-head">
              <span className="sb-modal-title">
                {step === "dados" && "Seus dados"}
                {step === "pix" && "Pagamento via Pix"}
                {step === "aguardando" && "Aguardando confirmação"}
                {step === "esgotado" && "Ops"}
                {step === "erro" && "Ops"}
              </span>
              <button className="sb-close" onClick={fecharModal}>✕</button>
            </div>

            {step === "dados" && (
              <form onSubmit={iniciarPix}>
                <div className="sb-resumo">
                  <span>{qtd} títulos</span>
                  <strong>{fmtBRL(total)}</strong>
                </div>
                <div className="sb-field">
                  <label>Nome completo</label>
                  <input className="sb-input" value={nome} onChange={(e) => setNome(e.target.value)} placeholder="Como podemos te chamar" required />
                </div>
                <div className="sb-field">
                  <label>WhatsApp (com DDD)</label>
                  <input className="sb-input" value={whats} onChange={(e) => setWhats(e.target.value)} placeholder="(51) 90000-0000" required />
                </div>
                <button className="sb-submit" type="submit">Gerar Pix</button>
              </form>
            )}

            {step === "pix" && (
              <div>
                <div className="sb-demo-note">
                  Depois de pagar, aguarde a confirmação — assim que o pagamento for conferido, seus números aparecem na Área do cliente pelo seu WhatsApp.
                </div>
                <div className="sb-qr-real" ref={qrRef}></div>
                <div className="sb-pix-timer">{fmtTimer(timer)}</div>
                <div className="sb-pix-sub">tempo para pagar antes do código expirar</div>
                <div className="sb-pix-code">{pixCode}</div>
                <button className="sb-copy-btn" onClick={copiarCodigo}>
                  {copiado ? "Copiado!" : "Copiar código Pix"}
                </button>
                <button className="sb-submit" onClick={() => setStep("aguardando")}>
                  Já paguei
                </button>
              </div>
            )}

            {step === "aguardando" && (
              <div className="sb-success">
                <div className="sb-success-badge">⏳</div>
                <h3>Tudo certo por aqui</h3>
                <p>
                  Assim que confirmarmos o pagamento, seus números aparecem na Área
                  do cliente, pelo seu WhatsApp. Pode fechar esta janela.
                </p>
                <button className="sb-btn-small" onClick={fecharModal}>Fechar</button>
              </div>
            )}

            {step === "esgotado" && (
              <div className="sb-esgotado">
                <p>Só restam {disponiveis} número(s) disponível(is) — menos do que os {qtd} que você pediu. Ajuste a quantidade e tente de novo.</p>
                <button className="sb-btn-small" onClick={fecharModal}>Entendi</button>
              </div>
            )}

            {step === "erro" && (
              <div className="sb-esgotado">
                <p>Não consegui registrar seu pedido agora. Verifique sua internet e tente novamente.</p>
                <button className="sb-btn-small" onClick={() => setStep("dados")}>Tentar de novo</button>
              </div>
            )}
          </div>
        </div>
      )}

      {/* RODAPÉ / ACESSO ADMIN */}
      <div className="sb-admin-footer">
        <div className="sb-legal-links">
          <button className="sb-admin-link" onClick={() => setLegalOpen("termos")}>Termos de participação</button>
          <span className="sb-legal-sep">·</span>
          <button className="sb-admin-link" onClick={() => setLegalOpen("privacidade")}>Política de privacidade</button>
        </div>
        <button className="sb-admin-link sb-admin-link-painel" onClick={() => setAdminOpen(true)}>Painel administrativo</button>
      </div>

      {legalOpen && (
        <div className="sb-overlay" onClick={(e) => e.target === e.currentTarget && setLegalOpen(null)}>
          <div className="sb-modal sb-modal-legal">
            <div className="sb-modal-head">
              <span className="sb-modal-title">
                {legalOpen === "termos" ? "Termos de participação" : "Política de privacidade"}
              </span>
              <button className="sb-close" onClick={() => setLegalOpen(null)}>✕</button>
            </div>
            {legalOpen === "termos" ? (
              <div className="sb-legal-texto">
                <p><strong>Rifa Cesta Bailarina</strong></p>
                <p>Esta rifa é organizada por Isadora Martins, em benefício do espetáculo de fim de ano de balé "Alice no País das Maravilhas". Canal de atendimento: WhatsApp (51) 98250-2414.</p>
                <p>Ao comprar um ou mais números, o Participante declara ter lido e aceitado estes termos.</p>

                <p><strong>1. Quem pode participar</strong></p>
                <p>Pessoas maiores de 18 anos. Os dados informados (nome e WhatsApp) devem ser verdadeiros — é por eles que os números são localizados depois.</p>

                <p><strong>2. Como funciona</strong></p>
                <p>Cada número custa R$ 2,00, dentro do intervalo de 0001 a 9999. O pagamento é feito via Pix. Os números são sorteados aleatoriamente e vinculados ao comprador somente após a confirmação do pagamento.</p>

                <p><strong>3. O prêmio e o sorteio</strong></p>
                <p>O prêmio é a Cesta Bailarina, descrita na página da rifa. O resultado será apurado pelos 4 últimos dígitos do 1º prêmio do sorteio da Loteria Federal, transmitido ao vivo pelo Portal Loterias Caixa em 25/11/2026, às 20h. Vence quem estiver com esse número registrado em seu nome.</p>

                <p><strong>4. Quem é o contemplado</strong></p>
                <p>Vence quem estiver com nome e WhatsApp registrados no número sorteado, mesmo que o pagamento tenha sido feito por outra pessoa em nome dele.</p>

                <p><strong>5. Cancelamento</strong></p>
                <p>Em caso de indício de fraude ou problema que comprometa a lisura da rifa, a organizadora pode cancelar a campanha, avisando os participantes.</p>

                <p><strong>6. Reembolso</strong></p>
                <p>Se a rifa for cancelada, ou em caso de pagamento em duplicidade ou por engano comprovado, o valor é devolvido pela organizadora mediante apresentação do comprovante.</p>

                <p><strong>7. Dados pessoais</strong></p>
                <p>Nome e WhatsApp são usados apenas para viabilizar a participação e localizar o número sorteado, conforme a LGPD (Lei nº 13.709/2018). Não são usados para nenhuma outra finalidade nem repassados a terceiros.</p>

                <p><strong>8. Disposições finais</strong></p>
                <p>Dúvidas ou reclamações devem ser direcionadas ao WhatsApp indicado no início deste documento.</p>
              </div>
            ) : (
              <div className="sb-legal-texto">
                <p>Última atualização: 23/09/2026</p>
                <p>Esta política explica como Isadora Martins, organizadora da rifa Cesta Bailarina, trata os dados fornecidos por quem participa.</p>

                <p><strong>1. Quais dados são coletados</strong></p>
                <p>Apenas nome completo e número de WhatsApp, informados no momento da compra dos números.</p>

                <p><strong>2. Para que esses dados são usados</strong></p>
                <p>Exclusivamente para: registrar sua compra, vincular os números sorteados a você, e entrar em contato para confirmar o pagamento e enviar seus números.</p>

                <p><strong>3. Onde os dados ficam armazenados</strong></p>
                <p>Em uma planilha privada, acessível apenas pela organizadora. Não há cookies, rastreamento de navegação nem uso de anúncios neste site.</p>

                <p><strong>4. Compartilhamento com terceiros</strong></p>
                <p>Seus dados não são vendidos nem repassados a ninguém. Não são usados para nenhuma outra finalidade além da rifa.</p>

                <p><strong>5. Seus direitos (LGPD — Lei nº 13.709/2018)</strong></p>
                <p>Você pode pedir a qualquer momento para consultar, corrigir ou excluir seus dados, entrando em contato pelo WhatsApp (51) 98250-2414.</p>

                <p><strong>6. Por quanto tempo os dados ficam guardados</strong></p>
                <p>Até a realização do sorteio e entrega do prêmio, podendo ser mantidos por um período razoável depois para eventual necessidade de comprovação.</p>

                <p><strong>7. Alterações</strong></p>
                <p>Esta política pode ser atualizada; a versão vigente é sempre a publicada na página da rifa.</p>
              </div>
            )}
          </div>
        </div>
      )}

      {adminOpen && (
        <div className="sb-overlay" onClick={(e) => e.target === e.currentTarget && setAdminOpen(false)}>
          <div className="sb-modal">
            <div className="sb-modal-head">
              <span className="sb-modal-title">Painel administrativo</span>
              <button className="sb-close" onClick={() => setAdminOpen(false)}>✕</button>
            </div>

            {!adminLoggedIn ? (
              <form onSubmit={adminEntrar}>
                <div className="sb-field">
                  <label>Senha</label>
                  <input
                    className="sb-input"
                    type="password"
                    value={adminSenha}
                    onChange={(e) => setAdminSenha(e.target.value)}
                    required
                  />
                </div>
                {adminMsg && <div className="sb-result-box">{adminMsg}</div>}
                <button className="sb-submit" type="submit">Entrar</button>
              </form>
            ) : (
              <div>
                {adminPedidos.length === 0 && <p>Nenhum pedido pendente no momento.</p>}
                {adminPedidos.map((p) => (
                  <div className="sb-admin-row" key={p.orderId}>
                    <div>
                      <strong>{p.nome}</strong> — {p.qtd} números — {fmtBRL(p.valor)}
                      <div style={{ fontSize: "12px", color: "#8a7570" }}>
                        {p.whats} · {p.orderId}
                      </div>
                    </div>
                    <button className="sb-btn-small" onClick={() => adminConfirmar(p.orderId)}>Confirmar</button>
                  </div>
                ))}
                {adminMsg && <div className="sb-result-box">{adminMsg}</div>}
                {envioWhats && (
                  <a
                    className="sb-submit"
                    href={envioWhats.url}
                    target="_blank"
                    rel="noopener noreferrer"
                    style={{ display: "block", textAlign: "center", textDecoration: "none", marginTop: "10px" }}
                  >
                    Enviar mensagem no WhatsApp para {envioWhats.nome}
                  </a>
                )}
                <button className="sb-btn-small" onClick={atualizarAdmin} style={{ marginTop: "10px" }}>
                  Atualizar lista
                </button>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<SorteioCestaBalet />);
</script>
</body>
</html>
